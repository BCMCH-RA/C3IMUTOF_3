<!doctype html>
<html>
<head><meta charset="utf-8"><title>ESP32-C3 IMU</title></head>
<body>
<button id="connect">Connect</button>
<div id="status"></div>
<script>
const SF = "6E400001-B5A3-F393-E0A9-E50E24DCCA9E";
const DC = "6E400003-B5A3-F393-E0A9-E50E24DCCA9E";
const CC = "6E400002-B5A3-F393-E0A9-E50E24DCCA9E";
const BATCH = 10;
const SAMPLE_BYTES = 18; // ts(4)+6×int16(12)+dist(2)

let device, server, chData, chCtrl;

document.getElementById("connect").onclick = async () => {
  device = await navigator.bluetooth.requestDevice({
    acceptAllDevices: true, optionalServices: [SF]
  });
  server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SF);
  chData = await svc.getCharacteristic(DC);
  chCtrl = await svc.getCharacteristic(CC);

  // 1. Epoch sync: send phone's Unix time (seconds) as 4 LE bytes
  const epochSec = Math.floor(Date.now() / 1000);
  const buf = new ArrayBuffer(4);
  new DataView(buf).setUint32(0, epochSec, true); // LE
  await chCtrl.writeValue(buf);

  // 2. Start notifications
  await chData.startNotifications();
  chData.addEventListener("characteristicvaluechanged", onData);
  document.getElementById("status").textContent = "connected";
};

function onData(e) {
  const v = e.target.value;                    // DataView
  const len = v.byteLength;
  if (len !== 1 + 2 + 4 + BATCH_SIZE * SAMPLE_BYTES) {
    console.warn("unexpected size", len);      // should be 187
    return;
  }
  const unitId = v.getUint8(0);
  const seq    = v.getUint16(1, true);         // LE
  const baseTs = v.getUint32(3, true);         // LE, seconds since epoch

  const samples = [];
  for (let i = 0; i < BATCH_SIZE; i++) {
    const o = 7 + i * SAMPLE_BYTES;
    const ts = v.getUint32(o, true);
    const ax = v.getInt16(o+4, true);
    const ay = v.getInt16(o+6, true);
    const az = v.getInt16(o+8, true);
    const gx = v.getInt16(o+10, true);
    const gy = v.getInt16(o+12, true);
    const gz = v.getInt16(o+14, true);
    const d  = v.getUint16(o+16, true);
    samples.push({ts, ax,ay,az, gx,gy,gz, d});
  }
  console.log(unitId, seq, baseTs, samples);
  // render / stream here
}
</script>
</body>
</html>
