<!doctype html>
<html><head><meta charset="utf-8"><title>IMU ×3 - Right/Left Leg/Torso</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #1a1a1a; color: #eee; }
  .unit { border: 1px solid #444; margin: 10px 0; padding: 10px; border-radius: 8px; }
  .connected { border-color: #0f0; }
  .disconnected { border-color: #666; }
  pre { background: #000; padding: 10px; overflow: auto; max-height: 40vh; }
  button { padding: 10px 20px; margin: 5px; cursor: pointer; }
</style></head>
<body>
<h2>Multi-Unit IMU (200Hz)</h2>
<div id="units"></div>
<pre id="log"></pre>
<script>
const SF = "6E400001-B5A3-F393-E0A9-E50E24DCCA9E";
const DC = "6E400003-B5A3-F393-E0A9-E50E24DCCA9E";
const CC = "6E400002-B5A3-F393-E0A9-E50E24DCCA9E";
const BATCH = 10, SAMPLE_BYTES = 18;

// Unit names mapping
const unitNames = {1: "Right Leg", 2: "Left Leg", 3: "Torso"};
const units = [1,2,3];
const state = {};

const container = document.getElementById("units");
units.forEach(u => {
  state[u] = {connected: false, baseTs: 0, count: 0};
  const div = document.createElement("div");
  div.className = "unit disconnected";
  div.id = `unit${u}`;
  div.innerHTML = `<h3>${unitNames[u]} (Unit ${u})</h3>
    <button onclick="connectUnit(${u})">Connect</button>
    <button onclick="disconnectUnit(${u})" disabled id="disc${u}">Disconnect</button>
    <span id="st${u}">Disconnected</span>`;
  container.appendChild(div);
});

async function connectUnit(u) {
  try {
    const dev = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true, optionalServices: [SF],
      namePrefix: `ESP32C3_Unit${u}`
    });
    const srv = await dev.gatt.connect();
    const s = await srv.getPrimaryService(SF);
    const chData = await s.getCharacteristic(DC);
    const chCtrl = await s.getCharacteristic(CC);

    // Epoch sync
    const epochSec = Math.floor(Date.now() / 1000);
    const ab = new ArrayBuffer(4);
    new DataView(ab).setUint32(0, epochSec, true);
    await chCtrl.writeValue(ab);

    await chData.startNotifications();
    chData.addEventListener("characteristicvaluechanged", e => onData(u, e));
    
    state[u].connected = true;
    state[u].baseTs = epochSec;
    document.getElementById(`unit${u}`).className = "unit connected";
    document.getElementById(`st${u}`).textContent = `synced ${epochSec}`;
    document.getElementById(`disc${u}`).disabled = false;
    state[u].dev = dev; state[u].srv = srv;
  } catch(e) { console.error(u, e); }
}

function disconnectUnit(u) {
  if(state[u].srv && state[u].srv.connected){
    state[u].srv.disconnect();
  }
  state[u].connected = false;
  document.getElementById(`unit${u}`).className = "unit disconnected";
  document.getElementById(`st${u}`).textContent = "Disconnected";
  document.getElementById(`disc${u}`).disabled = true;
}

function onData(u, e) {
  const v = e.target.value;
  if(v.byteLength !== 1 + 2 + 4 + BATCH_SIZE * SAMPLE_BYTES) return;
  
  const unitId = v.getUint8(0);
  const seq = v.getUint16(1, true);
  const baseTs = v.getUint32(3, true);
  state[u].count += BATCH_SIZE;
  
  const rows = [];
  for(let i=0;i<BATCH_SIZE;i++){
    const o = 7 + i*SAMPLE_BYTES;
    rows.push({
      ts: baseTs + v.getUint32(o, true)/1e6,
      ax: v.getInt16(o+4, true), ay: v.getInt16(o+6, true), az: v.getInt16(o+8, true),
      gx: v.getInt16(o+10, true), gy: v.getInt16(o+12, true), gz: v.getInt16(o+14, true),
      d: v.getUint16(o+16, true)
    });
  }
  
  const line = `[${unitNames[unitId]} seq=${seq} n=${state[u].count}] ` + 
    rows.map(r => `${r.ax},${r.ay},${r.az} | ${r.gx},${r.gy},${r.gz} | d=${r.dist}`).join(" ; ");
  document.getElementById("log").textContent += line + "\n";
}
</script>
</body></html>
